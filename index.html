    />
    <!-- Strategic Keywords for Better Visibility -->
    <meta
      name="keywords"
      content="Abhimanyu Surendran, Full-Stack Developer, Android Developer, Java Developer, MERN Stack, React Developer, Node.js, MongoDB, Web Development, App Development, Git, Full Stack Trainer, AI in development, Portfolio, Bhopal Developer, MCA Developer, S-TEK IT, Internship Experience, Mobile Developer India, Full Stack Projects, Code Optimization, CI/CD, Agile Developer, Software Trainer, Modern Web Developer, Firebase, Android Studio, REST APIs, Responsive Design, Cloud Deployment"
    />
    <title>Loading...</title>
    <link rel="icon" href="/title_logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" />
  </head>
  <body>
    <!-- Apply the saved theme before React starts, so a visitor who chose dark
         mode never sees a flash of the light theme while the page loads.
         (useTheme.js keeps it in sync afterwards.) -->
    <script>
      // Same keys as hooks/useTheme.js. The hook later checks the saved palette
      // against the real theme list and corrects it if needed.
      (function () {
        var isDark = true
        var themeId = null
        try {
          isDark = localStorage.getItem('darkMode') !== 'false'
          themeId = localStorage.getItem(isDark ? 'themeDark' : 'themeLight')
        } catch (error) {
          // Storage blocked: use the defaults.
        }
        if (isDark) document.body.classList.add('dark-mode')
        if (!/^[a-z]+$/.test(themeId || '')) themeId = isDark ? 'ember' : 'sandstone'
        document.documentElement.setAttribute('data-theme', themeId)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
